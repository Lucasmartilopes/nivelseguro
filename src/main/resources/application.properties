# ============================================================
# NivelSeguro API - configuracao
# Todos os valores sensiveis vem de VARIAVEIS DE AMBIENTE
# (definidas no docker-compose.yml a partir do arquivo .env).
# ============================================================
spring.application.name=nivelseguro-api
server.port=${SERVER_PORT:8080}

# ---------- Banco de dados (MySQL em container) ----------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/nivelseguro?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:nivelseguro}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool de conexoes enxuto (a VM tem pouca memoria)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

# ---------- JPA / Hibernate ----------
# As tabelas sao criadas pelo database/init.sql na 1a subida do container do banco.
# "update" apenas complementa o que faltar; nunca apaga dados.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
# Mostra o SQL executado nos logs do container (evidencia no "docker logs")
spring.jpa.show-sql=true

# ---------- JSON ----------
spring.jackson.serialization.write-dates-as-timestamps=false

# ---------- Actuator (health check) ----------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.nome=NivelSeguro API
info.app.descricao=Monitoramento de nivel de agua e alertas de enchente
info.app.versao=1.0.0
